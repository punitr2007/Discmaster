<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="ringGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
  </defs>
  <!-- Outer disc border -->
  <circle cx="64" cy="64" r="58" fill="url(#discGrad)" />
  <!-- Disc body -->
  <circle cx="64" cy="64" r="53" fill="url(#ringGrad)" stroke="#334155" stroke-width="2" />
  <!-- Iridescent highlights -->
  <path d="M 64 11 A 53 53 0 0 1 117 64 L 84 64 A 20 20 0 0 0 64 44 Z" fill="url(#shineGrad)" opacity="0.35" />
  <path d="M 64 117 A 53 53 0 0 1 11 64 L 44 64 A 20 20 0 0 0 64 84 Z" fill="url(#shineGrad)" opacity="0.35" />
  <!-- Inner Ring -->
  <circle cx="64" cy="64" r="22" fill="#1e293b" stroke="url(#discGrad)" stroke-width="2.5" />
  <!-- Center Spindle Hole -->
  <circle cx="64" cy="64" r="10" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <circle cx="64" cy="64" r="3" fill="#6366f1" />
</svg>
